/* ===== ที่เก็บข้อมูลถาวรในเบราว์เซอร์ (IndexedDB) ===== */
window.storage = (function () {
  const DB = "wandee_db", STORE = "kv";
  function open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  function reqP(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
  async function run(mode, fn) { const db = await open(); const t = db.transaction(STORE, mode); const s = t.objectStore(STORE); return fn(s); }
  return {
    async get(k) { const v = await run("readonly", (s) => reqP(s.get(k))); return v == null ? null : { key: k, value: v }; },
    async set(k, v) { await run("readwrite", (s) => reqP(s.put(v, k))); return { key: k, value: v }; },
    async delete(k) { await run("readwrite", (s) => reqP(s.delete(k))); return { key: k, deleted: true }; },
    async list(prefix = "") { const keys = await run("readonly", (s) => reqP(s.getAllKeys())); return { keys: keys.filter((x) => String(x).startsWith(prefix)) }; },
  };
})();

/* media storage */
async function loadMedia(id) {
  try { const r = await window.storage.get(MEDIA_KEY(id)); return r && r.value ? JSON.parse(r.value) : { brief: [], final: [] }; }
  catch { return { brief: [], final: [] }; }
}
async function saveMedia(id, m) {
  try {
    const json = JSON.stringify(m);
    if (json.length > 4800000) return { ok: false, reason: "size" };
    await window.storage.set(MEDIA_KEY(id), json);
    return { ok: true };
  } catch { return { ok: false, reason: "error" }; }
}
async function deleteMedia(id) { try { await window.storage.delete(MEDIA_KEY(id)); } catch {} }
function compressImage(file, maxDim = 1100, q = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = (height * maxDim) / width; width = maxDim; }
      else if (height > maxDim) { width = (width * maxDim) / height; height = maxDim; }
      const cv = document.createElement("canvas"); cv.width = width; cv.height = height;
      cv.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", q));
    };
    img.onerror = rej; img.src = url;
  });
}

function useIsDesktop() {
  const [d, setD] = useState(typeof window !== "undefined" ? window.matchMedia("(min-width:880px)").matches : true);
  useEffect(() => {
    const m = window.matchMedia("(min-width:880px)");
    const h = (e) => setD(e.matches);
    m.addEventListener("change", h); return () => m.removeEventListener("change", h);
  }, []);
  return d;
}

const seed = () => IMPORT_DATA.map(mk);

/* ============================ APP ============================ */
function App() {
  const isDesktop = useIsDesktop();
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState(() =>
    new URLSearchParams(window.location.search).has("pair") ? "tv" : "dash");
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORE_KEY);
        if (r && r.value) setItems(JSON.parse(r.value).map(normalize));
        else setItems(seed());
      } catch { setItems(seed()); }
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setItems(next); setSaving(true);
    try { await window.storage.set(STORE_KEY, JSON.stringify(next)); } catch {}
    setTimeout(() => setSaving(false), 500);
  }, []);

  const addLog = (c, text) => ({ ...c, log: [{ at: nowISO(), text }, ...(c.log || [])].slice(0, 30) });

  const upsert = async (item, media, meta) => {
    const prev = items.find((i) => i.id === item.id);
    const isNew = !prev;
    if (media) {
      const res = await saveMedia(item.id, media);
      if (!res.ok) {
        alert(res.reason === "size"
          ? "บันทึกรูปไม่สำเร็จ: รูปมีขนาดรวมใหญ่เกินไป\nลองลดจำนวนรูป หรือเลือกรูปที่เล็กลง"
          : "บันทึกรูปไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
      }
      item = { ...item, briefCount: media.brief.length, finalCount: media.final.length };
    }
    if (isNew) item = addLog(item, "สร้างคอนเทนต์");
    if (!isNew && meta?.dueChangeReason) {
      item = addLog(item, `เปลี่ยนวันส่งงาน ${fmtDate(meta.oldDue)} → ${fmtDate(item.due)} · เหตุผล: ${meta.dueChangeReason}`);
    }
    persist(isNew ? [...items, item] : items.map((i) => (i.id === item.id ? item : i)));
    setEditing(null);
    setViewing((v) => (v && v.id === item.id ? item : v));
  };
  const remove = (id) => { deleteMedia(id); persist(items.filter((i) => i.id !== id)); setViewing(null); };
  const patch = (id, fn, logText) => {
    const next = items.map((i) => {
      if (i.id !== id) return i;
      let u = fn(i);
      if (logText) u = addLog(u, logText);
      return u;
    });
    persist(next);
    setViewing((v) => (v && v.id === id ? next.find((x) => x.id === id) : v));
  };
  const setStatus = (id, status) => patch(id, (i) => ({ ...i, status }), `เปลี่ยนสถานะ → ${status}`);

  /* derived */
  const stats = useMemo(() => {
    const active = items.filter((i) => i.status !== CANCEL);
    const done = items.filter((i) => i.status === DONE).length;
    const budget = items.reduce((s, i) => s + i.budget, 0);
    const spent = items.reduce((s, i) => s + i.spent, 0);
    return {
      total: items.length, done, inprog: active.length - done,
      completion: active.length ? done / active.length : 0,
      budget, spent, remain: budget - spent,
      reach: items.reduce((s, i) => s + i.reach, 0),
      eng: items.reduce((s, i) => s + i.eng, 0),
      overdue: items.filter(isOverdue).length,
      waiting: items.filter((i) => i.status === APPROVE_WAIT).length,
    };
  }, [items]);

  const NAV = [
    ["dash", "ภาพรวม", LayoutDashboard],
    ["todo", "ต้องจัดการ", Bell],
    ["plan", "คอนเทนต์", ListChecks],
    ["cal", "ปฏิทิน", CalendarDays],
    ["team", "ทีม", Users],
    ["perf", "ผลงาน", Award],
    ["tv", "จอทีวี", Tv],
  ];
  const attentionCount = stats.overdue + stats.waiting;

  if (!loaded)
    return <div style={{ minHeight: "100vh", background: CREAM, display: "grid", placeItems: "center", color: ROSE, fontFamily: "Georgia,serif" }}>กำลังโหลด…</div>;

  const newItem = () => setEditing(mk({ date: todayISO() }));

  return (
    <div style={{ minHeight: "100vh", background: CREAM, color: INK, fontFamily: "'Trebuchet MS','Leelawadee UI','Sukhumvit Set',sans-serif", display: "flex" }}>
      <GlobalStyle />

      {/* DESKTOP SIDEBAR */}
      {isDesktop && (
        <aside style={{ width: 232, flexShrink: 0, background: `linear-gradient(180deg,${ROSE_DK},${ROSE})`, color: "#fff",
          position: "sticky", top: 0, height: "100vh", display: "flex", flexDirection: "column", padding: "20px 14px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 11, padding: "0 8px 18px" }}>
            <div style={{ width: 40, height: 40, borderRadius: 12, background: "rgba(255,255,255,.15)", display: "grid", placeItems: "center", border: "1px solid rgba(255,255,255,.25)" }}>
              <Sparkles size={21} color={GOLD} />
            </div>
            <div>
              <div style={{ fontFamily: "Georgia,serif", fontSize: 18, fontWeight: 700 }}>Wandee</div>
              <div style={{ fontSize: 11, opacity: .8 }}>Marketing System</div>
            </div>
          </div>
          <nav style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1 }}>
            {NAV.map(([k, label, Icon]) => (
              <button key={k} className="btn" onClick={() => setTab(k)}
                style={{ display: "flex", alignItems: "center", gap: 11, padding: "11px 13px", fontSize: 14.5, textAlign: "left",
                  background: tab === k ? "#fff" : "transparent", color: tab === k ? ROSE_DK : "#fff", borderRadius: 11 }}>
                <Icon size={18} /> <span style={{ flex: 1 }}>{label}</span>
                {k === "todo" && attentionCount > 0 && <Pill n={attentionCount} active={tab === k} />}
              </button>
            ))}
          </nav>
          <button className="btn" onClick={newItem}
            style={{ background: GOLD, color: "#fff", padding: "12px", fontSize: 14.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 8 }}>
            <Plus size={18} /> เพิ่มคอนเทนต์
          </button>
          <button className="btn" onClick={() => exportCSV(items)}

/* ============================ DASHBOARD ============================ */
function Dashboard({ items, stats, go, onExport, isDesktop }) {
  const statusData = STATUS.map((s) => ({ name: s.k, value: items.filter((i) => i.status === s.k).length, color: s.c })).filter((d) => d.value);

  const monthData = useMemo(() => {
    const map = {};
    items.forEach((i) => { const m = monthKey(i.date); if (!m) return;
      map[m] = map[m] || { m, total: 0, done: 0, budget: 0, spent: 0 };
      map[m].total++; if (i.status === DONE) map[m].done++; map[m].budget += i.budget; map[m].spent += i.spent; });
    return Object.values(map).sort((a, b) => a.m.localeCompare(b.m)).map((d) => ({ ...d, label: monthLabel(d.m) }));
  }, [items]);

    { label: "คอนเทนต์ทั้งหมด", value: num(stats.total), icon: ListChecks, c: ROSE },

      {(stats.overdue > 0 || stats.waiting > 0) && (

          <ChevronDown size={18} color="#C0392B" style={{ transform: "rotate(-90deg)" }} />
        </button>
      )}

      <div style={{ display: "grid", gap: 12, gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))" }}>
        {kpis.map((k, i) => <KpiCard key={i} {...k} delay={i} />)}
      </div>

      <div style={{ display: "grid", gap: 14, gridTemplateColumns: "repeat(auto-fit,minmax(300px,1fr))", marginTop: 16 }}>

          {statusData.length ? <ResponsiveContainer width="100%" height={250}>

                <span style={{ flex: 1, fontSize: 13.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.topic}</span>

            ))}
          </div>
        </Panel>
      )}

  );

/* ============================ NEEDS ATTENTION ============================ */
function NeedsAttention({ items, onView, onStatus }) {
  const overdue = items.filter(isOverdue).sort((a, b) => a.due.localeCompare(b.due));
  const today = items.filter((i) => i.due === todayISO() && i.status !== DONE && i.status !== CANCEL);
  const week = items.filter((i) => { const d = daysTo(i.due); return i.due && d > 0 && d <= 7 && i.status !== DONE && i.status !== CANCEL; }).sort((a, b) => a.due.localeCompare(b.due));
  const waiting = items.filter((i) => i.status === APPROVE_WAIT);
  const qcMiss = items.filter((i) => PRE_POST.includes(i.status) && !qcFull(i));
  const groups = [
    { t: "เลยกำหนดส่ง", icon: AlertTriangle, c: "#C0392B", list: overdue },
    { t: "ครบกำหนดวันนี้", icon: Clock, c: "#C77F0A", list: today },
    { t: "ครบกำหนดใน 7 วัน", icon: CalendarDays, c: "#B07F1A", list: week },
    { t: "รออนุมัติ", icon: BadgeCheck, c: "#2E6FB0", list: waiting },
    { t: "QC ยังไม่ครบ (ใกล้โพสต์)", icon: ClipboardCheck, c: "#7B5EA7", list: qcMiss },
  ].filter((g) => g.list.length);

  return (
    <div className="fu">
      <h2 className="sec">ต้องจัดการ</h2>
      <p className="subtle">งานที่ต้องตามและตรวจ รวมไว้ที่เดียว</p>
      {groups.length === 0 && <div className="card" style={{ padding: 36, textAlign: "center", color: "#7FA86F" }}>
        <CheckCircle2 size={34} color="#3F7D34" style={{ marginBottom: 8 }} /><div style={{ fontSize: 15, fontWeight: 600, color: "#3F7D34" }}>เคลียร์หมดแล้ว ไม่มีงานค้าง 🎉</div></div>}
      {groups.map((g) => (
        <div key={g.t} style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "0 2px 9px" }}>
            <g.icon size={17} color={g.c} />
            <span style={{ fontWeight: 700, fontSize: 15, color: INK }}>{g.t}</span>
            <span style={{ background: g.c, color: "#fff", fontSize: 11, fontWeight: 700, minWidth: 20, height: 20, borderRadius: 10, display: "grid", placeItems: "center", padding: "0 6px" }}>{g.list.length}</span>
          </div>
          <div style={{ display: "grid", gap: 9 }}>
            {g.list.map((c) => <ContentCard key={c.id} c={c} onView={onView} onStatus={onStatus} />)}
          </div>
        </div>
      ))}
    </div>
  );
}

        <div style={{ position: "relative", flex: 1, minWidth: 170 }}>

          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="ค้นหาหัวข้อ…" style={{ ...sel, width: "100%", paddingLeft: 34, boxSizing: "border-box" }} />

        <select value={fS} onChange={(e) => setFS(e.target.value)} style={sel}><option value="">ทุกสถานะ</option>{STATUS.map((s) => <option key={s.k} value={s.k}>{s.k}</option>)}</select>
      </div>

        {filtered.length === 0 && <div className="card" style={{ padding: 30, textAlign: "center", color: "#B6A89F" }}>ไม่พบรายการ — กด “เพิ่ม” เพื่อสร้างใหม่</div>}
        {filtered.map((c) => (
          <div key={c.id} style={{ position: "relative" }}>
            <ContentCard c={c} onView={onView} onStatus={onStatus} />

            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================ CALENDAR ============================ */
function CalendarView({ items, onView }) {
  const [cur, setCur] = useState(() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; });
  const startDow = new Date(cur.y, cur.m, 1).getDay();
  const days = new Date(cur.y, cur.m + 1, 0).getDate();
  const byDay = {};
  items.forEach((i) => { if (monthKey(i.date) === `${cur.y}-${String(cur.m + 1).padStart(2, "0")}`) { const d = +i.date.slice(8, 10); (byDay[d] = byDay[d] || []).push(i); } });
  const names = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
  const cells = [...Array(startDow).fill(null), ...Array.from({ length: days }, (_, i) => i + 1)];
  return (
    <div className="fu">
      <h2 className="sec">ปฏิทิน</h2>
      <p className="subtle">แตะที่งานเพื่อดูรายละเอียด</p>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <button className="btn" onClick={() => setCur((c) => c.m === 0 ? { y: c.y - 1, m: 11 } : { ...c, m: c.m - 1 })} style={{ background: "#F3EAE4", color: ROSE_DK, padding: "8px 15px", fontSize: 18 }}>‹</button>
        <div style={{ fontFamily: "Georgia,serif", fontSize: 18, fontWeight: 700, color: ROSE_DK }}>{names[cur.m]} {cur.y + 543}</div>
        <button className="btn" onClick={() => setCur((c) => c.m === 11 ? { y: c.y + 1, m: 0 } : { ...c, m: c.m + 1 })} style={{ background: "#F3EAE4", color: ROSE_DK, padding: "8px 15px", fontSize: 18 }}>›</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,minmax(0,1fr))", gap: 5, width: "100%" }}>
        {["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"].map((d) => <div key={d} style={{ textAlign: "center", fontSize: 12, fontWeight: 700, color: MUTE, padding: "4px 0" }}>{d}</div>)}
        {cells.map((d, i) => (
          <div key={i} className="card" style={{ minHeight: 80, minWidth: 0, overflow: "hidden", padding: 4, opacity: d ? 1 : .3, background: d ? CARD : "transparent", border: d ? `1px solid ${LINE}` : "none", boxShadow: "none" }}>
            {d && <div style={{ fontSize: 11.5, fontWeight: 700, color: MUTE, marginBottom: 3 }}>{d}</div>}
            {(byDay[d] || []).slice(0, 3).map((it) => { const st = STATUS_MAP[it.status] || STATUS[0]; return (
              <div key={it.id} onClick={() => onView(it)} title={it.topic} style={{ cursor: "pointer", fontSize: 10, lineHeight: 1.25, padding: "2px 4px", borderRadius: 5, marginBottom: 3, background: st.bg, color: st.c, maxWidth: "100%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.topic}</div>
            ); })}
            {(byDay[d] || []).length > 3 && <div style={{ fontSize: 9.5, color: "#B6A89F" }}>+{byDay[d].length - 3}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================ TEAM / WORKLOAD ============================ */
function Team({ items }) {
  const build = (field) => {
    const map = {};
    items.forEach((i) => { const who = (i[field] || "").trim(); if (!who) return;
      map[who] = map[who] || { who, total: 0, done: 0, overdue: 0, inprog: 0 };
      map[who].total++;
      if (i.status === DONE) map[who].done++;
      else if (i.status !== CANCEL) map[who].inprog++;
      if (isOverdue(i)) map[who].overdue++;
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  };
  const graphics = build("graphic"), captions = build("caption");
  const Section = ({ title, rows }) => (
    <Panel title={title} pad={14}>
      {rows.length === 0 ? <Empty h={80} t="ยังไม่มีข้อมูล" /> : (
        <div style={{ display: "grid", gap: 8 }}>
          {rows.map((r) => (
            <div key={r.who} style={{ display: "flex", alignItems: "center", gap: 12, padding: "9px 6px", borderBottom: `1px solid ${"#F0E7E0"}` }}>
              <div style={{ width: 36, height: 36, borderRadius: 11, background: "#F3EAE4", color: ROSE_DK, fontWeight: 800, display: "grid", placeItems: "center", flexShrink: 0 }}>{r.who.slice(0, 2)}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{r.who}</div>
                <div style={{ fontSize: 11.5, color: MUTE }}>ทั้งหมด {r.total} · เสร็จ {r.done} · ค้าง {r.inprog}</div>
              </div>
              {r.overdue > 0 && <span style={{ fontSize: 11, fontWeight: 700, color: "#C0392B", background: "#FBE3E0", padding: "3px 9px", borderRadius: 20 }}>เลยกำหนด {r.overdue}</span>}
              <div style={{ width: 64, textAlign: "right" }}>
                <div style={{ fontSize: 11, color: MUTE }}>{Math.round((r.done / r.total) * 100)}%</div>
                <div style={{ height: 6, background: "#F0E7E0", borderRadius: 4, marginTop: 3, overflow: "hidden" }}>
                  <div style={{ width: `${(r.done / r.total) * 100}%`, height: "100%", background: "#3F7D34" }} /></div>
              </div>
            </div>
          ))}
        </div>
      )}
    </Panel>
  );
  return (
    <div className="fu">
      <h2 className="sec">ภาระงานทีม</h2>
      <p className="subtle">ดูว่าใครมีงานเท่าไหร่ ค้างกี่ชิ้น เลยกำหนดกี่ชิ้น</p>
      <div style={{ display: "grid", gap: 14, gridTemplateColumns: "repeat(auto-fit,minmax(300px,1fr))" }}>
        <Section title="ทีมกราฟิก" rows={graphics} />
        <Section title="ทีมแคปชั่น" rows={captions} />
      </div>
    </div>
  );
}

/* ============================ PERFORMANCE ============================ */
function Performance({ items, onView }) {
  const posted = items.filter((i) => i.status === DONE);
  const totReach = posted.reduce((s, i) => s + i.reach, 0);
  const totEng = posted.reduce((s, i) => s + i.eng, 0);
  const totSpent = posted.reduce((s, i) => s + i.spent, 0);
  const avgER = totReach ? totEng / totReach : 0;
  const byReach = [...posted].filter((i) => i.reach > 0).sort((a, b) => b.reach - a.reach).slice(0, 5);
  const byER = [...posted].filter((i) => i.reach > 0).sort((a, b) => engRate(b) - engRate(a)).slice(0, 5);
  // plan vs actual
  const planVs = items.filter((i) => i.actualDate && i.date);
  const late = planVs.filter((i) => i.actualDate > i.date).length;
  const onTime = planVs.filter((i) => i.actualDate <= i.date).length;
  const overBudget = items.filter((i) => i.spent > i.budget && i.budget > 0).length;

  const Stat = ({ label, value, sub, c }) => (
    <div className="card" style={{ padding: 15 }}>
      <div style={{ fontSize: 12, color: MUTE }}>{label}</div>
      <div style={{ fontSize: 23, fontWeight: 800, fontFamily: "Georgia,serif", color: c || INK, marginTop: 5 }}>{value}</div>
      {sub && <div style={{ fontSize: 11.5, color: MUTE, marginTop: 3 }}>{sub}</div>}
    </div>
  );
  const RankList = ({ title, rows, metric }) => (
    <Panel title={title} pad={14}>
      {rows.length === 0 ? <Empty h={90} /> : <div style={{ display: "grid", gap: 7 }}>
        {rows.map((c, i) => (
          <div key={c.id} onClick={() => onView(c)} style={{ cursor: "pointer", display: "flex", alignItems: "center", gap: 10, padding: "7px 4px" }}>
            <span style={{ width: 24, height: 24, borderRadius: 8, background: i === 0 ? GOLD : "#EFE4DC", color: i === 0 ? "#fff" : MUTE, fontWeight: 800, display: "grid", placeItems: "center", fontSize: 12, flexShrink: 0 }}>{i + 1}</span>
            <span style={{ flex: 1, fontSize: 13, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.topic}</span>
            <span style={{ fontSize: 12.5, fontWeight: 700, color: ROSE }}>{metric(c)}</span>
          </div>
        ))}
      </div>}
    </Panel>
  );

  return (
    <div className="fu">
      <h2 className="sec">ผลงาน & ตัวชี้วัด</h2>
      <p className="subtle">วัดผลคอนเทนต์ที่โพสต์แล้ว และเทียบแผนกับงานจริง</p>
      <div style={{ display: "grid", gap: 12, gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))" }}>
        <Stat label="Reach รวม (โพสต์แล้ว)" value={num(totReach)} c="#2E6FB0" />
        <Stat label="Engagement รวม" value={num(totEng)} c={ROSE} sub={`อัตรา ${(avgER * 100).toFixed(1)}%`} />
        <Stat label="ต้นทุนต่อ 1,000 reach" value={totReach ? baht(Math.round((totSpent / totReach) * 1000)) : "—"} c="#C0392B" />
        <Stat label="โพสต์ตรงแผน" value={`${onTime}/${onTime + late}`} c="#3F7D34" sub={late ? `ช้ากว่าแผน ${late} ชิ้น` : "ตรงเวลาทั้งหมด"} />
      </div>

      <div style={{ display: "grid", gap: 14, gridTemplateColumns: "repeat(auto-fit,minmax(300px,1fr))", marginTop: 16 }}>
        <RankList title="Reach สูงสุด" rows={byReach} metric={(c) => "👁 " + num(c.reach)} />
        <RankList title="Engagement Rate สูงสุด" rows={byER} metric={(c) => (engRate(c) * 100).toFixed(1) + "%"} />
      </div>

      <Panel title="เทียบแผน vs งานจริง" pad={14}>
        <div style={{ display: "grid", gap: 10, gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))" }}>
          <MiniStat label="โพสต์ตรงเวลา" value={onTime} color="#3F7D34" />
          <MiniStat label="โพสต์ช้ากว่าแผน" value={late} color="#C0392B" />
          <MiniStat label="ใช้งบเกินที่ตั้งไว้" value={overBudget} color="#C77F0A" />
          <MiniStat label="ยังไม่ระบุวันโพสต์จริง" value={items.filter((i) => i.status === DONE && !i.actualDate).length} color={MUTE} />
        </div>
        <div style={{ fontSize: 11.5, color: MUTE, marginTop: 12 }}>* กรอก “วันที่โพสต์จริง” และ “ใช้จริง” ในแต่ละคอนเทนต์ เพื่อให้การเทียบแม่นยำ</div>
      </Panel>
    </div>
  );
}
const MiniStat = ({ label, value, color }) => (
  <div style={{ textAlign: "center", padding: "12px 8px", background: "#FCF8F5", borderRadius: 12, border: `1px solid ${LINE}` }}>
    <div style={{ fontSize: 24, fontWeight: 800, fontFamily: "Georgia,serif", color }}>{value}</div>
    <div style={{ fontSize: 11.5, color: MUTE, marginTop: 3 }}>{label}</div>
  </div>
);

/* ============================ DETAIL MODAL ============================ */
function DetailModal({ item: c, isDesktop, onClose, onStatus, onPatch, onEdit, onDelete }) {
  const st = STATUS_MAP[c.status] || STATUS[0];
  const od = isOverdue(c);
  const [media, setMedia] = useState({ brief: [], final: [] });
  const [lightbox, setLightbox] = useState(null);
  const [cmt, setCmt] = useState(""); const [who, setWho] = useState("");
  const [approver, setApprover] = useState("");
  useEffect(() => { loadMedia(c.id).then(setMedia); }, [c.id]);

  const toggleQc = (key) => onPatch(c.id, (i) => ({ ...i, qc: { ...i.qc, [key]: !i.qc?.[key] } }));
  const approve = () => onPatch(c.id, (i) => ({ ...i, approvedBy: approver.trim() || "ผู้ตรวจ", approvedAt: nowISO() }), `อนุมัติโดย ${approver.trim() || "ผู้ตรวจ"}`);
  const unapprove = () => onPatch(c.id, (i) => ({ ...i, approvedBy: "", approvedAt: "" }), "ยกเลิกอนุมัติ");
  const addComment = () => { const t = cmt.trim(); if (!t) return;
    onPatch(c.id, (i) => ({ ...i, comments: [...(i.comments || []), { id: `m${Date.now()}`, who: who.trim() || "ทีม", text: t, at: nowISO() }] }));
    setCmt(""); };

  const rows = [
    ["วันที่วางแผนโพสต์", c.date ? fmtDate(c.date) : "—"],
    ["วันที่โพสต์จริง", c.actualDate ? fmtDate(c.actualDate) : "—"],
    ["สาขา", c.branch || "—"], ["ประเภท (Pillar)", c.pillar || "—"], ["รูปแบบ", c.format || "—"],
    ["กราฟิกโดย", c.graphic || "—"], ["แคปชั่นโดย", c.caption || "—"], ["วันส่งกราฟิก", c.due ? fmtDate(c.due) : "—"],
    ["แพลตฟอร์ม", c.platforms.length ? c.platforms.join(", ") : "—"],
    ["งบยิงแอด", baht(c.budget)], ["ใช้จริง", baht(c.spent)],
    ["Reach", num(c.reach)], ["Engagement", num(c.eng) + (c.reach ? ` (${(engRate(c) * 100).toFixed(1)}%)` : "")],
  ];

  return (
    <Sheet isDesktop={isDesktop} onClose={onClose} title="รายละเอียด & ตรวจงาน">
      {/* topic + status */}
      <div className="card" style={{ padding: 15, marginBottom: 13, boxShadow: "none" }}>

          {c.approvedBy && <span style={{ fontSize: 12, fontWeight: 700, color: "#3F7D34", background: "#E2EFDA", padding: "4px 10px", borderRadius: 20, display: "inline-flex", alignItems: "center", gap: 5 }}><BadgeCheck size={13} /> อนุมัติแล้ว</span>}
          {od && <span style={{ fontSize: 12, fontWeight: 700, color: "#C0392B", background: "#FBE3E0", padding: "4px 10px", borderRadius: 20, display: "inline-flex", alignItems: "center", gap: 5 }}><AlertTriangle size={13} /> เลยกำหนด</span>}
        </div>
        <div style={{ fontSize: 18, fontWeight: 700, lineHeight: 1.4, fontFamily: "Georgia,serif" }}>{c.topic || "(ไม่มีหัวข้อ)"}</div>
      </div>

      {/* QC checklist */}
      <div className="card" style={{ padding: 14, marginBottom: 13, boxShadow: "none" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <span style={{ fontWeight: 700, fontSize: 14, color: ROSE_DK, display: "flex", alignItems: "center", gap: 7 }}><ClipboardCheck size={16} /> เช็กลิสต์ก่อนโพสต์</span>
          <QcBadge c={c} />
        </div>
        <div style={{ display: "grid", gap: 7 }}>
          {QC_ITEMS.map((q) => { const on = !!c.qc?.[q.key]; return (
            <button key={q.key} className="btn" onClick={() => toggleQc(q.key)}
              style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 11px", textAlign: "left", background: on ? "#E2EFDA" : "#F7F1ED", borderRadius: 10 }}>
              <span style={{ width: 20, height: 20, borderRadius: 6, border: `2px solid ${on ? "#3F7D34" : "#C9B9AF"}`, background: on ? "#3F7D34" : "transparent", display: "grid", placeItems: "center", flexShrink: 0 }}>

/* ============================ EDIT MODAL ============================ */
function EditModal({ item, isDesktop, onClose, onSave }) {
  const [f, setF] = useState({ ...item, videos: item.videos || [] });
  const [media, setMedia] = useState({ brief: [], final: [] });
  const [busy, setBusy] = useState(false); const [vid, setVid] = useState("");
  const originalDue = item.due; // due date locked once set
  const [dueReason, setDueReason] = useState("");
  const dueChanged = originalDue && f.due && f.due !== originalDue;
  useEffect(() => { loadMedia(item.id).then(setMedia); }, [item.id]);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const togglePlat = (p) => set("platforms", f.platforms.includes(p) ? f.platforms.filter((x) => x !== p) : [...f.platforms, p]);
  const lbl = { fontSize: 12.5, fontWeight: 600, color: "#7A6A62", marginBottom: 4, display: "block" };
  const inp = { width: "100%", padding: "9px 11px", borderRadius: 10, border: "1px solid #E3D6CD", fontSize: 14, boxSizing: "border-box", background: "#fff", color: INK };
  const addImages = async (kind, files) => { if (!files?.length) return; setBusy(true); const out = []; const failed = [];
    for (const file of Array.from(files)) {
      try { out.push(await compressImage(file)); } catch { failed.push(file.name || "รูป"); }
    }
    if (out.length) setMedia((m) => ({ ...m, [kind]: [...m[kind], ...out] }));
    setBusy(false);
    if (failed.length) alert(`เปิดรูปไม่ได้ ${failed.length} ไฟล์: ${failed.join(", ")}\n\nสาเหตุที่พบบ่อย: ไฟล์ .HEIC จากไอโฟน\nวิธีแก้: ตั้งกล้องไอโฟนเป็น “เข้ากันได้มากที่สุด” (Settings ▸ Camera ▸ Formats) หรือบันทึกรูปเป็น JPG ก่อนอัปโหลด`); };
  const removeImage = (kind, idx) => setMedia((m) => ({ ...m, [kind]: m[kind].filter((_, i) => i !== idx) }));
  const addVideo = () => { const u = vid.trim(); if (!u) return; set("videos", [...(f.videos || []), { id: `v${Date.now()}`, url: u }]); setVid(""); };
  const removeVideo = (id) => set("videos", (f.videos || []).filter((v) => v.id !== id));

  return (
    <Sheet isDesktop={isDesktop} onClose={onClose} title={item.topic ? "แก้ไขคอนเทนต์" : "เพิ่มคอนเทนต์ใหม่"}>
      <div style={{ display: "grid", gap: 13 }}>
        <div><label style={lbl}>หัวข้อคอนเทนต์ *</label>
          <textarea value={f.topic} onChange={(e) => set("topic", e.target.value)} rows={2} style={{ ...inp, resize: "vertical" }} placeholder="เช่น โปรแยก Botox ลดกราม…" /></div>
        <Row><Field label="วันที่วางแผนโพสต์"><input type="date" value={f.date} onChange={(e) => set("date", e.target.value)} style={inp} /></Field>
          <Field label="สถานะ"><Sel value={f.status} onChange={(v) => set("status", v)} opts={STATUS.map((s) => s.k)} /></Field></Row>
        <Row><Field label="สาขา"><Sel value={f.branch} onChange={(v) => set("branch", v)} opts={BRANCHES} ph="เลือก" /></Field>
          <Field label="ประเภท (Pillar)"><Sel value={f.pillar} onChange={(v) => set("pillar", v)} opts={PILLARS} ph="เลือก" /></Field></Row>
        <Row><Field label="รูปแบบ"><Sel value={f.format} onChange={(v) => set("format", v)} opts={FORMATS} ph="เลือก" /></Field>
          <Field label="วันส่งกราฟิก (Due)">
            <input type="date" value={f.due}
              onChange={(e) => { const v = e.target.value; if (!v && originalDue) return; set("due", v); }}
              style={inp} />
          </Field></Row>
        {originalDue && (
          <div style={{ marginTop: -4, fontSize: 11.5, color: "#B07F1A", display: "flex", alignItems: "center", gap: 5 }}>
            <AlertTriangle size={12} /> มีวันส่งงานแล้ว — ลบไม่ได้ หากเปลี่ยนวันต้องระบุเหตุผล
          </div>
        )}
        {dueChanged && (
          <div style={{ background: "#FBF1D9", border: "1px solid #EAD9A8", borderRadius: 12, padding: 12 }}>
            <label style={{ ...lbl, color: "#8A6A12" }}>เหตุผลการเปลี่ยนวันส่งงาน (จำเป็น) *</label>
            <div style={{ fontSize: 12, color: "#9A7A22", marginBottom: 7 }}>
              จาก {fmtDate(originalDue)} → เป็น {fmtDate(f.due)}
            </div>
            <textarea value={dueReason} onChange={(e) => setDueReason(e.target.value)} rows={2}
              style={{ ...inp, resize: "vertical", borderColor: "#EAD9A8" }} placeholder="เช่น ลูกค้าขอเลื่อน / งานกราฟิกติดคิว…" />
          </div>
        )}
        <Row><Field label="กราฟิกโดย"><input value={f.graphic} onChange={(e) => set("graphic", e.target.value)} style={inp} placeholder="ชื่อทีม" /></Field>
          <Field label="แคปชั่นโดย"><input value={f.caption} onChange={(e) => set("caption", e.target.value)} style={inp} placeholder="ชื่อทีม" /></Field></Row>

        <div><label style={lbl}>แพลตฟอร์มที่ลง</label>
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
            {PLATFORMS.map((p) => { const on = f.platforms.includes(p); return (
              <button key={p} className="btn" onClick={() => togglePlat(p)} style={{ padding: "7px 13px", fontSize: 12.5, border: `1px solid ${on ? ROSE : "#E3D6CD"}`, background: on ? ROSE : "#fff", color: on ? "#fff" : "#7A6A62" }}>{p}</button>
            ); })}
          </div></div>

        <Row><Field label="งบยิงแอด (฿)"><input type="number" value={f.budget || ""} onChange={(e) => set("budget", e.target.value)} style={inp} placeholder="0" /></Field>
          <Field label="ใช้จริง (฿)"><input type="number" value={f.spent || ""} onChange={(e) => set("spent", e.target.value)} style={inp} placeholder="0" /></Field></Row>
        <Row><Field label="Reach"><input type="number" value={f.reach || ""} onChange={(e) => set("reach", e.target.value)} style={inp} placeholder="0" /></Field>
          <Field label="Engagement"><input type="number" value={f.eng || ""} onChange={(e) => set("eng", e.target.value)} style={inp} placeholder="0" /></Field></Row>
        <Field label="วันที่โพสต์จริง (กรอกหลังโพสต์)"><input type="date" value={f.actualDate} onChange={(e) => set("actualDate", e.target.value)} style={inp} /></Field>

        {/* MEDIA */}
        <div style={{ borderTop: "1px solid #EADFD7", paddingTop: 13 }}>
          <div style={{ fontSize: 13.5, fontWeight: 700, color: ROSE_DK, marginBottom: 10 }}>📂 สื่อ / ไฟล์แนบ</div>
          <label style={lbl}>รูปบรีฟ / รูปอ้างอิง</label>
          <ImageUploader kind="brief" srcs={media.brief} onAdd={addImages} onRemove={removeImage} busy={busy} />
          <div style={{ height: 12 }} />
          <Field label="ลิงก์แคปชั่น / ข้อความบรีฟ"><input value={f.briefLink} onChange={(e) => set("briefLink", e.target.value)} style={inp} placeholder="วางลิงก์ Google Docs / Notes…" /></Field>
          <div style={{ height: 12 }} />
          <label style={lbl}>รูปงานที่ทำเสร็จ</label>
          <ImageUploader kind="final" srcs={media.final} onAdd={addImages} onRemove={removeImage} busy={busy} />
          <div style={{ height: 12 }} />
          <label style={lbl}>วิดีโอ (วางลิงก์)</label>
          <div style={{ display: "flex", gap: 7 }}>
            <input value={vid} onChange={(e) => setVid(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addVideo(); }} style={{ ...inp, flex: 1 }} placeholder="ลิงก์ YouTube / TikTok / Drive…" />
            <button className="btn" onClick={addVideo} style={{ background: ROSE, color: "#fff", padding: "0 16px", flexShrink: 0 }}><Plus size={18} /></button>
          </div>
          {(f.videos || []).length > 0 && <div style={{ marginTop: 8, display: "grid", gap: 6 }}>
            {f.videos.map((v) => (
              <div key={v.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "#F3EAE4", borderRadius: 9, padding: "7px 10px" }}>
                <span style={{ flex: 1, fontSize: 12.5, color: ROSE_DK, wordBreak: "break-all" }}>🎥 {v.url}</span>
                <button className="btn" onClick={() => removeVideo(v.id)} style={{ background: "transparent", color: "#C0392B", padding: 2 }}><X size={16} /></button>
              </div>
            ))}
          </div>}
        </div>

        <Field label="หมายเหตุ"><textarea value={f.note} onChange={(e) => set("note", e.target.value)} rows={2} style={{ ...inp, resize: "vertical" }} /></Field>

        <button className="btn" disabled={busy} onClick={() => { if (!f.topic.trim()) { alert("กรุณาใส่หัวข้อคอนเทนต์"); return; }
            if (originalDue && !f.due) { alert("ไม่สามารถลบวันส่งงานที่ตั้งไว้แล้วได้"); return; }
            if (dueChanged && !dueReason.trim()) { alert("กรุณาระบุเหตุผลการเปลี่ยนวันส่งงาน"); return; }
            onSave({ ...f, budget: +f.budget || 0, spent: +f.spent || 0, reach: +f.reach || 0, eng: +f.eng || 0 }, media,
              dueChanged ? { dueChangeReason: dueReason.trim(), oldDue: originalDue } : null); }}
          style={{ background: busy ? "#C9A9B5" : ROSE, color: "#fff", padding: 13, fontSize: 15, marginTop: 4, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          <Save size={18} /> {busy ? "กำลังประมวลผลรูป…" : "บันทึก"}
        </button>
      </div>
    </Sheet>
  );
}
const Row = ({ children }) => <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 11 }}>{children}</div>;

function ImageUploader({ kind, srcs, onAdd, onRemove, busy }) {
  const id = `up_${kind}`;
  const [drag, setDrag] = useState(false);
  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(78px,1fr))", gap: 8 }}>
        {srcs.map((s, i) => (
          <div key={i} style={{ position: "relative" }}>
            <img src={s} alt="" style={{ width: "100%", aspectRatio: "1", objectFit: "cover", borderRadius: 10, border: `1px solid ${LINE}` }} />
            <button className="btn" onClick={() => onRemove(kind, i)} style={{ position: "absolute", top: -6, right: -6, background: "#C0392B", color: "#fff", width: 22, height: 22, borderRadius: "50%", display: "grid", placeItems: "center", padding: 0 }}><X size={13} /></button>
          </div>
        ))}
        <label htmlFor={id}
          onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={(e) => { e.preventDefault(); setDrag(false); onAdd(kind, e.dataTransfer.files); }}
          style={{ cursor: "pointer", aspectRatio: "1", border: `1.5px dashed ${drag ? ROSE : "#D5C2B6"}`, borderRadius: 10, display: "grid", placeItems: "center", color: drag ? ROSE : "#B6A89F", background: drag ? "#FBEFF3" : "#FCF8F5", transition: ".15s" }}>
          <div style={{ textAlign: "center", fontSize: 11 }}>{busy ? "…" : <><Plus size={20} /><div style={{ marginTop: 2 }}>เพิ่ม / ลากวาง</div></>}</div>
        </label>
      </div>
      <input id={id} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={(e) => { onAdd(kind, e.target.files); e.target.value = ""; }} />
    </div>
  );
}

/* ============================ TV SCREENS (admin) ============================ */
function TVScreens({ isDesktop }) {
  const [screens, setScreens] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [code, setCode] = useState("");
  const [pairing, setPairing] = useState(false);
  const [pairErr, setPairErr] = useState("");
  const [editing, setEditing] = useState(null);

  useEffect(() => {
    if (!FIREBASE_READY) { setLoaded(true); return; }
    const q = query(collection(tvDb, SCREENS_COL), where("status", "==", "paired"));
    const unsub = onSnapshot(q, (snap) => {
      setScreens(snap.docs.map((d) => d.data()).sort((a, b) => (a.name || "").localeCompare(b.name || "")));
      setLoaded(true);
    }, () => setLoaded(true));
    return unsub;
  }, []);

  /* มาจากการสแกน QR บนจอทีวี (?pair=CODE) — เติมรหัสให้เลย เหลือแค่กดจับคู่ */
  useEffect(() => {
    const p = new URLSearchParams(window.location.search).get("pair");
    if (p) { setCode(p.toUpperCase()); window.history.replaceState(null, "", window.location.pathname); }
  }, []);

  const pair = async () => {
    const c = code.trim().toUpperCase();
    setPairErr("");
    if (!c) return;
    setPairing(true);
    try {
      const ref = doc(tvDb, SCREENS_COL, c);
      const snap = await getDoc(ref);
      if (!snap.exists()) setPairErr("ไม่พบรหัสนี้ ตรวจสอบว่าเปิดหน้าจอทีวีค้างไว้และพิมพ์รหัสถูกต้อง");
      else if (snap.data().status === "paired") setPairErr("รหัสนี้ถูกจับคู่ไปแล้ว");
      else {
        await updateDoc(ref, { status: "paired", name: `จอทีวี ${screens.length + 1}`, pairedAt: serverTimestamp() });
        setCode("");
      }
    } catch (e) { setPairErr("จับคู่ไม่สำเร็จ: " + (e.message || e)); }
    setPairing(false);
  };

  const rename = (c, name) => updateDoc(doc(tvDb, SCREENS_COL, c), { name }).catch(() => {});
  const unpair = (c) => { if (confirm("เลิกจับคู่จอนี้? ทีวีจะแสดงรหัสจับคู่ใหม่")) deleteDoc(doc(tvDb, SCREENS_COL, c)).catch(() => {}); };

  if (!FIREBASE_READY) {
    return (
      <div className="fu">
        <h2 className="sec">จอทีวี</h2>
        <p className="subtle">เชื่อมต่อเว็บแอปนี้กับทีวีเพื่อแสดงสไลด์โปรโมชั่น/วิดีโอ</p>
        <Panel title="ยังไม่ได้ตั้งค่า Firebase">
          <p style={{ fontSize: 13.5, lineHeight: 1.7, color: MUTE }}>
            ฟีเจอร์จอทีวีต้องใช้ Firebase เป็นตัวกลาง sync ระหว่างทีวีกับแอดมิน<br />
            กรุณาทำตามขั้นตอนใน <b>TV_SETUP.md</b> แล้วนำค่า config มาใส่ในตัวแปร <code>FIREBASE_CONFIG</code> ที่ต้นไฟล์ index.html
          </p>
        </Panel>
      </div>
    );
  }

  return (
    <div className="fu">
      <h2 className="sec">จอทีวี</h2>
      <p className="subtle">จับคู่ทีวีแล้วจัดการสไลด์โปรโมชั่น/วิดีโอที่จะแสดงบนจอ</p>

      <Panel title="จับคู่จอทีวีใหม่">
        <p style={{ fontSize: 13, color: MUTE, margin: "0 0 10px" }}>
          เปิด <code>{location.origin + location.pathname}?screen=1</code> บนเบราว์เซอร์ของทีวี จะขึ้นรหัส 6 หลักพร้อม QR —
          <b> สแกน QR ด้วยมือถือ</b> รหัสจะถูกกรอกให้อัตโนมัติ หรือพิมพ์รหัสเองด้านล่างก็ได้
        </p>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={code} onChange={(e) => setCode(e.target.value.toUpperCase())} maxLength={6} placeholder="รหัสจากทีวี เช่น 7K2M9A"
            style={{ flex: 1, padding: "11px 13px", borderRadius: 10, border: `1px solid ${LINE}`, fontSize: 16, letterSpacing: 2, fontWeight: 700, textAlign: "center" }} />
          <button className="btn" disabled={pairing || !code.trim()} onClick={pair}
            style={{ background: ROSE, color: "#fff", padding: "0 20px", fontSize: 14, opacity: pairing ? .6 : 1 }}>จับคู่</button>
        </div>
        {pairErr && <div style={{ color: "#C0392B", fontSize: 12.5, marginTop: 8 }}>{pairErr}</div>}
      </Panel>

      <div style={{ marginTop: 14, display: "grid", gap: 12, gridTemplateColumns: "repeat(auto-fit,minmax(260px,1fr))" }}>
        {!loaded ? <Empty t="กำลังโหลด…" /> : screens.length === 0 ? <Empty t="ยังไม่มีจอทีวีที่จับคู่" /> :
          screens.map((s) => (
            <div key={s.code} className="card" style={{ padding: 14 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                {isOnline(s.lastSeenAt) ? <Wifi size={16} color="#3F7D34" /> : <WifiOff size={16} color="#B6A89F" />}
                <input defaultValue={s.name} onBlur={(e) => rename(s.code, e.target.value)}
                  style={{ flex: 1, fontWeight: 700, fontSize: 14.5, border: "none", background: "transparent", padding: "2px 0" }} />
                <Tag>{s.code}</Tag>
              </div>
              <div style={{ fontSize: 12, color: MUTE, marginBottom: 10 }}>
                {(LAYOUTS.find((l) => l.k === (s.layout || "full")) || LAYOUTS[0]).label} · {screenZones(s).main.length + screenZones(s).side.length} สไลด์
                {s.ticker ? " · มีตัววิ่ง" : ""} · {isOnline(s.lastSeenAt) ? "ออนไลน์" : "ออฟไลน์"}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button className="btn" onClick={() => setEditing(s)} style={{ flex: 1, background: "#F3EAE4", color: ROSE_DK, padding: "8px", fontSize: 13 }}>จัดการหน้าจอ</button>
                <button className="btn" onClick={() => unpair(s.code)} style={{ background: "#FBE3E0", color: "#C0392B", padding: "8px 12px" }}><Trash2 size={15} /></button>
              </div>
            </div>
          ))}
      </div>

      {editing && <PlaylistEditor isDesktop={isDesktop} screen={editing} onClose={() => setEditing(null)} />}
    </div>
  );
}

function PlaylistEditor({ isDesktop, screen, onClose }) {
  const [layout, setLayout] = useState(screen.layout || "full");
  const [zones, setZones] = useState(() => screenZones(screen));
  const [zone, setZone] = useState("main");
  const [ticker, setTicker] = useState(screen.ticker || "");
  const [showClock, setShowClock] = useState(screen.showClock !== false);
  const [f, setF] = useState({ type: "image", url: "", title: "", subtitle: "", duration: 8 });
  const [saving, setSaving] = useState(false);

  useEffect(() => { if (layout === "full") setZone("main"); }, [layout]);
  const slides = zones[zone] || [];
  const setSlides = (fn) => setZones((z) => ({ ...z, [zone]: fn(z[zone] || []) }));

  const add = () => {
    if (f.type !== "text" && !f.url.trim()) return alert("กรอกลิงก์รูป/วิดีโอก่อน");
    if (f.type === "text" && !f.title.trim()) return alert("กรอกข้อความหัวข้อก่อน");
    setSlides((s) => [...s, { id: `s${Date.now()}`, ...f, duration: +f.duration || 8 }]);
    setF({ type: "image", url: "", title: "", subtitle: "", duration: 8 });
  };
  const move = (i, dir) => setSlides((s) => {
    const n = [...s]; const j = i + dir;
    if (j < 0 || j >= n.length) return s;
    [n[i], n[j]] = [n[j], n[i]]; return n;
  });
  const del = (i) => setSlides((s) => s.filter((_, x) => x !== i));

  const save = async () => {
    setSaving(true);
    try {
      await updateDoc(doc(tvDb, SCREENS_COL, screen.code),
        { layout, zones, ticker: ticker.trim(), showClock, updatedAt: serverTimestamp() });
      onClose();
    }
    catch (e) { alert("บันทึกไม่สำเร็จ: " + (e.message || e)); }
    setSaving(false);
  };

  const TYPE_ICON = { image: ImageIcon, video: Video, text: Type };

  return (
    <Sheet isDesktop={isDesktop} onClose={onClose} title={`หน้าจอ ${screen.name}`}>
      <Panel title="รูปแบบการแบ่งจอ">
        <div style={{ display: "grid", gap: 8 }}>
          {LAYOUTS.map((l) => (
            <button key={l.k} className="btn" onClick={() => setLayout(l.k)}
              style={{ display: "flex", alignItems: "center", gap: 10, textAlign: "left", padding: "10px 12px",
                background: layout === l.k ? ROSE : "#F3EAE4", color: layout === l.k ? "#fff" : ROSE_DK, borderRadius: 10 }}>
              <LayoutPreview k={l.k} active={layout === l.k} />
              <span style={{ flex: 1 }}>
                <span style={{ fontWeight: 700, fontSize: 13.5, display: "block" }}>{l.label}</span>
                <span style={{ fontSize: 11.5, opacity: .85 }}>{l.desc}</span>
              </span>
            </button>
          ))}
        </div>
      </Panel>

      {layout !== "full" && (
        <div style={{ display: "flex", gap: 8, margin: "14px 0 0" }}>
          {[["main", "โซนหลัก"], ["side", layout === "split" ? "โซนขวา" : "โซนแถบข้าง"]].map(([k, label]) => (
            <button key={k} className="btn" onClick={() => setZone(k)}
              style={{ flex: 1, padding: "9px", fontSize: 13, background: zone === k ? GOLD : "#F3EAE4", color: zone === k ? "#fff" : ROSE_DK }}>
              {label} ({(zones[k] || []).length})
            </button>
          ))}
        </div>
      )}
      <div style={{ height: 14 }} />
      <div style={{ display: "grid", gap: 8, marginBottom: 14 }}>
        {slides.length === 0 && <Empty h={100} t="ยังไม่มีสไลด์ เพิ่มด้านล่าง" />}
        {slides.map((s, i) => {
          const Icon = TYPE_ICON[s.type] || ImageIcon;
          return (
            <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", background: "#fff", border: `1px solid ${LINE}`, borderRadius: 10 }}>
              <Icon size={16} color={ROSE} />
              <div style={{ flex: 1, minWidth: 0, fontSize: 13 }}>
                <div style={{ fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.title || s.url || "(ไม่มีชื่อ)"}</div>
                <div style={{ fontSize: 11, color: MUTE }}>{s.duration}s</div>
              </div>
              <button className="btn" onClick={() => move(i, -1)} style={{ background: "#F3EAE4", padding: 6 }}><ArrowUp size={14} /></button>
              <button className="btn" onClick={() => move(i, 1)} style={{ background: "#F3EAE4", padding: 6 }}><ArrowDown size={14} /></button>
              <button className="btn" onClick={() => del(i)} style={{ background: "#FBE3E0", color: "#C0392B", padding: 6 }}><Trash2 size={14} /></button>
            </div>
          );
        })}
      </div>

      <Panel title="เพิ่มสไลด์ใหม่">
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          {["image", "video", "text"].map((t) => (
            <button key={t} className="btn" onClick={() => setF((x) => ({ ...x, type: t }))}
              style={{ flex: 1, padding: "8px", fontSize: 12.5, background: f.type === t ? ROSE : "#F3EAE4", color: f.type === t ? "#fff" : ROSE_DK }}>
              {t === "image" ? "รูปภาพ" : t === "video" ? "วิดีโอ" : "ข้อความ"}
            </button>
          ))}
        </div>
        {f.type !== "text" ? (
          <input value={f.url} onChange={(e) => setF((x) => ({ ...x, url: e.target.value }))} placeholder={f.type === "image" ? "ลิงก์รูปภาพ (https://...)" : "ลิงก์วิดีโอ (https://....mp4)"}
            style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: `1px solid ${LINE}`, fontSize: 13.5, marginBottom: 8, boxSizing: "border-box" }} />
        ) : (
          <>
            <input value={f.title} onChange={(e) => setF((x) => ({ ...x, title: e.target.value }))} placeholder="ข้อความหัวข้อ เช่น โปรพิเศษเดือนนี้ ลด 20%"
              style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: `1px solid ${LINE}`, fontSize: 13.5, marginBottom: 8, boxSizing: "border-box" }} />
            <input value={f.subtitle} onChange={(e) => setF((x) => ({ ...x, subtitle: e.target.value }))} placeholder="ข้อความรอง (ถ้ามี)"
              style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: `1px solid ${LINE}`, fontSize: 13.5, marginBottom: 8, boxSizing: "border-box" }} />
          </>
        )}
        {f.type !== "text" && (
          <input value={f.title} onChange={(e) => setF((x) => ({ ...x, title: e.target.value }))} placeholder="คำบรรยายทับภาพ (ถ้ามี)"
            style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: `1px solid ${LINE}`, fontSize: 13.5, marginBottom: 8, boxSizing: "border-box" }} />
        )}
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <span style={{ fontSize: 12.5, color: MUTE }}>แสดงนาน (วินาที)</span>
          <input type="number" min={2} value={f.duration} onChange={(e) => setF((x) => ({ ...x, duration: e.target.value }))}
            style={{ width: 70, padding: "8px 10px", borderRadius: 9, border: `1px solid ${LINE}`, fontSize: 13.5 }} />
          <button className="btn" onClick={add} style={{ marginLeft: "auto", background: GOLD, color: "#fff", padding: "9px 16px", fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}><Plus size={15} /> เพิ่ม</button>
        </div>
      </Panel>

      <div style={{ height: 14 }} />
      <Panel title="ตัววิ่งข้อความ & นาฬิกา">
        <input value={ticker} onChange={(e) => setTicker(e.target.value)}
          placeholder="ข้อความตัววิ่งด้านล่างจอ เช่น โปรเดือนนี้ ลด 20% ทุกสาขา (เว้นว่าง = ไม่แสดง)"
          style={{ width: "100%", padding: "10px 12px", borderRadius: 9, border: `1px solid ${LINE}`, fontSize: 13.5, marginBottom: 10, boxSizing: "border-box" }} />
        <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, cursor: "pointer" }}>
          <input type="checkbox" checked={showClock} onChange={(e) => setShowClock(e.target.checked)} style={{ width: 17, height: 17, accentColor: ROSE }} />
          แสดงนาฬิกา + วันที่ มุมขวาบนของจอ
        </label>
      </Panel>

      <button className="btn" onClick={save} disabled={saving}
        style={{ width: "100%", marginTop: 14, background: ROSE, color: "#fff", padding: "13px", fontSize: 14.5, opacity: saving ? .6 : 1 }}>
        {saving ? "กำลังบันทึก…" : "บันทึกหน้าจอ"}
      </button>
    </Sheet>
  );
}

/* ไอคอนจิ๋วแสดงรูปแบบการแบ่งจอ */
function LayoutPreview({ k, active }) {
  const line = active ? "rgba(255,255,255,.9)" : ROSE;
  const box = { border: `1.5px solid ${line}`, borderRadius: 3 };
  return (
    <span style={{ display: "flex", gap: 2, width: 42, height: 26, flexShrink: 0 }}>
      {k === "full" && <span style={{ ...box, flex: 1 }} />}
      {k === "main-side" && <><span style={{ ...box, flex: 7 }} /><span style={{ ...box, flex: 3 }} /></>}
      {k === "split" && <><span style={{ ...box, flex: 1 }} /><span style={{ ...box, flex: 1 }} /></>}
    </span>
  );
}

/* ============================ TV PLAYER (opens on the TV's browser via ?screen=1) ============================ */
function TVPlayer() {
  const [state, setState] = useState("boot"); // boot | pairing | live | error | nofirebase
  const [code, setCode] = useState(null);
  const [screen, setScreen] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => {
    if (!FIREBASE_READY) { setState("nofirebase"); return; }
    let unsub;
    (async () => {
      try {
        let c = localStorage.getItem(TV_CODE_KEY);
        if (!c) {
          for (let i = 0; i < 5 && !c; i++) {
            const candidate = genTvCode();
            const ref = doc(tvDb, SCREENS_COL, candidate);
            if (!(await getDoc(ref)).exists()) {
              await setDoc(ref, { code: candidate, name: "จอทีวี", status: "pending", playlist: [], createdAt: serverTimestamp(), lastSeenAt: serverTimestamp() });
              c = candidate;
            }
          }
          if (!c) throw new Error("สร้างรหัสไม่สำเร็จ ลองรีเฟรชหน้านี้อีกครั้ง");
        }
        localStorage.setItem(TV_CODE_KEY, c);
        setCode(c);
        unsub = onSnapshot(doc(tvDb, SCREENS_COL, c), (snap) => {
          if (!snap.exists()) { localStorage.removeItem(TV_CODE_KEY); setCode(null); setState("boot"); return; }
          const d = snap.data();
          setScreen(d);
          setState(d.status === "paired" ? "live" : "pairing");
        }, (e) => { setState("error"); setErr(e.message || String(e)); });
      } catch (e) { setState("error"); setErr(e.message || String(e)); }
    })();
    return () => unsub && unsub();
  }, []);

  useEffect(() => {
    if (!code || !FIREBASE_READY) return;
    const h = setInterval(() => updateDoc(doc(tvDb, SCREENS_COL, code), { lastSeenAt: serverTimestamp() }).catch(() => {}), 25000);
    return () => clearInterval(h);
  }, [code]);

  const shell = (children) => (
    <div style={{ position: "fixed", inset: 0, background: `linear-gradient(160deg,${ROSE_DK},${ROSE})`, color: "#fff",
      display: "grid", placeItems: "center", fontFamily: "'Trebuchet MS','Leelawadee UI',sans-serif", textAlign: "center", padding: 24 }}>
      {children}
    </div>
  );

  if (state === "nofirebase") return shell(<div><Tv size={48} /><p style={{ marginTop: 14, fontSize: 18 }}>ยังไม่ได้ตั้งค่า Firebase<br /><span style={{ fontSize: 14, opacity: .8 }}>ดูขั้นตอนใน TV_SETUP.md</span></p></div>);
  if (state === "error") return shell(<div><AlertTriangle size={48} /><p style={{ marginTop: 14, fontSize: 16 }}>เกิดข้อผิดพลาด: {err}</p></div>);
  if (state === "boot") return shell(<div className="sp" style={{ width: 40, height: 40, border: "3px solid rgba(255,255,255,.35)", borderTopColor: "#fff", borderRadius: "50%", animation: "spin .8s linear infinite" }} />);
  if (state === "pairing") {
    const pairUrl = `${location.origin}${location.pathname}?pair=${code}`;
    return shell(
      <div>
        <Tv size={40} />
        <p style={{ fontSize: 17, marginTop: 14, opacity: .9 }}>สแกน QR ด้วยมือถือ หรือเปิดระบบการตลาด → แท็บ “จอทีวี” แล้วกรอกรหัสนี้</p>
        <div style={{ fontSize: 72, fontWeight: 800, letterSpacing: 10, margin: "16px 0", fontFamily: "monospace" }}>{code}</div>
        <div style={{ background: "#fff", borderRadius: 16, padding: 12, display: "inline-block", margin: "0 0 16px" }}>
          <img alt="QR สำหรับจับคู่" width={190} height={190} style={{ display: "block" }}
            src={`https://api.qrserver.com/v1/create-qr-code/?size=190x190&margin=0&data=${encodeURIComponent(pairUrl)}`} />
        </div>
        <p style={{ fontSize: 13, opacity: .7 }}>รอการจับคู่จากแอดมิน…</p>
      </div>
    );
  }
  return <TVLive screen={screen} />;
}

/* หน้าจอสด — แบ่งโซนตาม layout + ตัววิ่ง + นาฬิกา */
function TVLive({ screen }) {
  const layout = screen?.layout || "full";
  const { main, side } = screenZones(screen);
  const ticker = (screen?.ticker || "").trim();
  const empty = !main.length && !side.length && !ticker;

  if (empty) return (
    <div style={{ position: "fixed", inset: 0, background: ROSE_DK, color: "#fff", display: "grid", placeItems: "center", fontSize: 18, textAlign: "center" }}>
      <div><Tv size={40} /><p style={{ marginTop: 12 }}>เชื่อมต่อสำเร็จ — รอเนื้อหาโปรโมชั่นจากแอดมิน</p></div>
    </div>
  );

  return (
    <div style={{ position: "fixed", inset: 0, background: "#000", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <style>{`
        @keyframes tvticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
        @keyframes tvfade{from{opacity:0}to{opacity:1}}
      `}</style>
      <div style={{ flex: 1, display: "flex", minHeight: 0 }}>
        <div style={{ flex: layout === "main-side" ? 7 : 1, position: "relative", minWidth: 0 }}>
          <ZonePlayer slides={main} scale={1} />
        </div>
        {layout !== "full" && (
          <div style={{ flex: layout === "main-side" ? 3 : 1, position: "relative", minWidth: 0, borderLeft: "2px solid rgba(255,255,255,.12)" }}>
            <ZonePlayer slides={side} scale={layout === "split" ? 0.8 : 0.55} />
          </div>
        )}
      </div>
      {ticker && <Ticker text={ticker} />}
      {screen?.showClock !== false && <TVClock />}
    </div>
  );
}

/* สไลด์โชว์ของโซนหนึ่ง — วนตามเวลา duration ของแต่ละสไลด์ */
function ZonePlayer({ slides, scale = 1 }) {
  const [i, setI] = useState(0);
  const slide = slides[i % (slides.length || 1)];

  useEffect(() => { if (i >= slides.length) setI(0); }, [slides, i]);
  useEffect(() => {
    if (slides.length < 2) return;
    const t = setTimeout(() => setI((n) => (n + 1) % slides.length), Math.max(2, +slide?.duration || 8) * 1000);
    return () => clearTimeout(t);
  }, [i, slides, slide]);

  if (!slides.length) return (
    <div style={{ width: "100%", height: "100%", display: "grid", placeItems: "center", background: `linear-gradient(160deg,${ROSE_DK},${ROSE})`, color: "rgba(255,255,255,.55)" }}>
      <div style={{ textAlign: "center" }}><Sparkles size={30 * scale + 10} color={GOLD} /><div style={{ fontFamily: "Georgia,serif", fontSize: 22 * scale + 6, marginTop: 8 }}>Wandee Clinic</div></div>
    </div>
  );

  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden" }}>
      {slide.type === "image" && (
        <div key={slide.id} style={{ position: "relative", width: "100%", height: "100%", animation: "tvfade .6s ease" }}>
          <img src={slide.url} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
          {slide.title && <SlideCaption title={slide.title} scale={scale} />}
        </div>
      )}
      {slide.type === "video" && (
        <div key={slide.id} style={{ position: "relative", width: "100%", height: "100%", animation: "tvfade .6s ease" }}>
          <video src={slide.url} autoPlay muted loop playsInline style={{ width: "100%", height: "100%", objectFit: "cover" }} />
          {slide.title && <SlideCaption title={slide.title} scale={scale} />}
        </div>
      )}
      {slide.type === "text" && (
        <div key={slide.id} style={{ width: "100%", height: "100%", display: "grid", placeItems: "center", background: `linear-gradient(160deg,${ROSE_DK},${ROSE})`, color: "#fff", textAlign: "center", padding: 40 * scale, boxSizing: "border-box", animation: "tvfade .6s ease" }}>
          <div>
            <div style={{ fontFamily: "Georgia,serif", fontSize: 56 * scale, fontWeight: 700 }}>{slide.title}</div>
            {slide.subtitle && <div style={{ fontSize: 24 * scale, marginTop: 16 * scale, opacity: .9 }}>{slide.subtitle}</div>}
          </div>
        </div>
      )}
    </div>
  );
}
const SlideCaption = ({ title, scale = 1 }) => (
  <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, background: "linear-gradient(0deg,rgba(0,0,0,.7),transparent)", color: "#fff", padding: `${60 * scale}px ${40 * scale}px ${30 * scale}px`, fontSize: 28 * scale, fontWeight: 700 }}>{title}</div>
);

/* แถบตัววิ่งข้อความด้านล่างจอ */
function Ticker({ text }) {
  const seg = `${text}   •   `;
  const dur = Math.max(18, seg.length * 0.45);
  return (
    <div style={{ height: 58, background: ROSE_DK, borderTop: `3px solid ${GOLD}`, color: "#fff", display: "flex", alignItems: "center", overflow: "hidden", flexShrink: 0 }}>
      <div style={{ whiteSpace: "nowrap", fontSize: 26, fontWeight: 600, animation: `tvticker ${dur}s linear infinite` }}>
        {seg.repeat(6)}
      </div>
    </div>
  );
}

/* นาฬิกา + วันที่ไทย มุมขวาบน */
function TVClock() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  const days = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
  const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  const p2 = (n) => String(n).padStart(2, "0");
  return (
    <div style={{ position: "absolute", top: 18, right: 24, textAlign: "right", color: "#fff", textShadow: "0 2px 10px rgba(0,0,0,.65)", zIndex: 5, pointerEvents: "none" }}>
      <div style={{ fontSize: 42, fontWeight: 800, fontFamily: "monospace", lineHeight: 1 }}>{p2(now.getHours())}:{p2(now.getMinutes())}</div>
      <div style={{ fontSize: 15, opacity: .9, marginTop: 4 }}>วัน{days[now.getDay()]}ที่ {now.getDate()} {months[now.getMonth()]} {now.getFullYear() + 543}</div>
    </div>
  );
}

/* ============================ CSV EXPORT ============================ */
function exportCSV(items) {
  const head = ["No", "วันที่วางแผน", "วันที่โพสต์จริง", "สาขา", "ประเภท", "รูปแบบ", "หัวข้อ", "กราฟิก", "แคปชั่น",
    "วันส่งกราฟิก", "สถานะ", "อนุมัติโดย", "QC", "แพลตฟอร์ม", "งบ", "ใช้จริง", "Reach", "Engagement", "EngRate%", "ลิงก์แคปชั่น", "จำนวนวิดีโอ", "หมายเหตุ"];
  const esc = (v) => { const s = (v ?? "").toString().replace(/"/g, '""'); return `"${s}"`; };
  const rows = items.map((c, i) => [
    i + 1, c.date, c.actualDate, c.branch, c.pillar, c.format, c.topic, c.graphic, c.caption,
    c.due, c.status, c.approvedBy, `${qcDone(c)}/${QC_ITEMS.length}`, c.platforms.join(";"),
    c.budget, c.spent, c.reach, c.eng, c.reach ? (engRate(c) * 100).toFixed(1) : "", c.briefLink, (c.videos || []).length, c.note,
  ].map(esc).join(","));
  const csv = "\uFEFF" + [head.map(esc).join(","), ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `wandee-marketing-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}


function Root() {
  const isScreen = new URLSearchParams(window.location.search).get("screen") === "1";
  return isScreen ? <TVPlayer /> : <App />;
}

createRoot(document.getElementById("root")).render(React.createElement(Root));

const b = document.getElementById("boot"); if (b) b.remove();
</script>
</body>
